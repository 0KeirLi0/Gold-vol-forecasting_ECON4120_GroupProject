[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-volatility-pipeline"
version = "0.1.0"
description = "Daily gold futures data preparation for volatility forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "arch>=7.2",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
interactive = ["jupyterlab>=4.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
